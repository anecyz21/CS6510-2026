server:
  port: "${SERVER_PORT:8082}"
spring:
  application: { name: checkout-service }
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/checkout}"
    username: "${DB_USERNAME:checkout_service}"
    password: "${DB_PASSWORD:checkout_service}"
    # Recorded explicitly for the baseline; equals the Spring Boot default.
    hikari: { maximum-pool-size: 10 }
  flyway: { enabled: true }
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
