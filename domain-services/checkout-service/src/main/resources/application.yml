server:
  port: "${SERVER_PORT:8082}"
  shutdown: graceful
spring:
  application: { name: checkout-service }
  datasource:
    # Credentials come only from deployment configuration (FR-028); nothing is defaulted here.
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    hikari: { maximum-pool-size: "${DB_POOL_SIZE:10}" }
  flyway: { enabled: true }
  lifecycle: { timeout-per-shutdown-phase: 20s }
  # The catalog projection poll and the recovery worker must not wait on each other.
  task:
    scheduling:
      pool:
        size: 2
management:
  endpoint:
    health:
      probes: { enabled: true }
      show-details: always
      # Readiness covers this service's own database only; Flyway has finished before it can be UP.
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,metrics
catalog:
  url: "${CATALOG_URL:http://localhost:8081}"
  projection:
    poll-interval: 15s
    max-staleness: 60s
inventory:
  url: "${INVENTORY_URL:http://localhost:8083}"
checkout:
  completion:
    # Public completion returns 503 SERVICE_UNAVAILABLE once this passes without a confirmed outcome (A4).
    request-deadline: "${CHECKOUT_COMPLETION_REQUEST_DEADLINE:5s}"
  # Recovery and retry budgets (research R9); environment overrides exist for fault tests.
  recovery:
    scan-interval: "${CHECKOUT_RECOVERY_SCAN_INTERVAL:1s}"
    cancel-after: "${CHECKOUT_RECOVERY_CANCEL_AFTER:30s}"
    attention-after: "${CHECKOUT_RECOVERY_ATTENTION_AFTER:20}"
    lease-duration: "${CHECKOUT_RECOVERY_LEASE_DURATION:10s}"
    backoff-base: 250ms
    backoff-cap: 5s
    in-request-retries: 3
    in-request-backoff: 100ms,200ms,400ms
