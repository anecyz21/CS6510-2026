server:
  port: "${SERVER_PORT:8082}"
  shutdown: graceful
spring:
  application: { name: checkout-service }
  datasource:
    # Credentials come only from deployment configuration (FR-028); nothing is defaulted here.
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    hikari: { maximum-pool-size: "${DB_POOL_SIZE:10}" }
  flyway: { enabled: true }
  lifecycle: { timeout-per-shutdown-phase: 20s }
  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP:localhost:9092}"
  # The recovery worker and the projection's catch-up check must not wait on each other.
  task:
    scheduling:
      pool:
        size: 2
management:
  endpoint:
    health:
      probes: { enabled: true }
      show-details: always
      # Readiness covers this service's own database and the broker (005 research R9); Flyway has
      # finished before it can be UP. Nothing routes on readiness while running.
      group:
        readiness:
          include: readinessState,db,kafka,catalogProjection
  endpoints:
    web:
      exposure:
        include: health,metrics
checkout:
  completion:
    # Public completion returns 503 SERVICE_UNAVAILABLE once this passes without a confirmed outcome (A4).
    request-deadline: "${CHECKOUT_COMPLETION_REQUEST_DEADLINE:5s}"
  # Resend and recovery budgets (005 research R5); environment overrides exist for fault tests.
  recovery:
    scan-interval: "${CHECKOUT_RECOVERY_SCAN_INTERVAL:1s}"
    cancel-after: "${CHECKOUT_RECOVERY_CANCEL_AFTER:30s}"
    attention-after: "${CHECKOUT_RECOVERY_ATTENTION_AFTER:20}"
    backoff-base: 250ms
    backoff-cap: 5s
  # Accepted-scan outbox relay (research R4).
  relay:
    poll-interval: 200ms
    retention: 24h
