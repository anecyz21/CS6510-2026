# Fault-injection override (005 quickstart Q4–Q8, research R13). Never used for measured runs.
#   docker compose -f docker-compose.yml -f docker-compose.faults.yml --env-file services.env up -d
#
# - Checkout runs with the fault-injection profile, which exposes
#   POST/DELETE /internal/v1/ops/faults/{point} to halt the JVM after a named saga step commits
#   (AFTER_FREEZE, AFTER_RESERVED_APPLIED, AFTER_COMMITTED_APPLIED).
# - MESSAGING_FAULTS_DUPLICATE_SENDS=true makes every outbox sender and the scan relay send each
#   record twice (duplicate delivery of all four message types).
# - MESSAGING_FAULTS_HOLD_SENDS=true keeps Inventory's committed replies unsent, as a crash between
#   the reservation commit and the reply send would; restart Inventory without it to release them.
# - CHECKOUT_RECOVERY_CANCEL_AFTER can be shortened for the cancel-versus-commit race test.
# Services no longer call each other, so there is no network hop to proxy: outages are made by
# stopping a container or the broker.
services:
  checkout:
    environment:
      SPRING_PROFILES_ACTIVE: fault-injection
      CHECKOUT_RECOVERY_CANCEL_AFTER: ${CHECKOUT_RECOVERY_CANCEL_AFTER:-30s}
      MESSAGING_FAULTS_DUPLICATE_SENDS: ${MESSAGING_FAULTS_DUPLICATE_SENDS:-false}

  inventory:
    environment:
      MESSAGING_FAULTS_DUPLICATE_SENDS: ${MESSAGING_FAULTS_DUPLICATE_SENDS:-false}
      MESSAGING_FAULTS_HOLD_SENDS: ${MESSAGING_FAULTS_HOLD_SENDS:-false}
