services:
  mysql:
    image: mysql:8.4
    environment: { MYSQL_ROOT_PASSWORD: root }
    # Keep the workstation's existing 3306 owner untouched; service-to-service traffic stays on mysql:3306.
    ports: ["3307:3306"]
    volumes: ["./mysql/init:/docker-entrypoint-initdb.d:ro"]
    healthcheck: { test: ["CMD-SHELL", "mysqladmin ping -h localhost -proot --silent"], interval: 5s, timeout: 3s, retries: 30 }
  catalog:
    build: ../catalog-service
    environment: { DB_URL: jdbc:mysql://mysql:3306/catalog, DB_USERNAME: catalog_service, DB_PASSWORD: catalog_service }
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health"], interval: 10s, timeout: 3s, retries: 12 }
    depends_on: { mysql: { condition: service_healthy } }
  checkout:
    build: ../checkout-service
    environment: { DB_URL: jdbc:mysql://mysql:3306/checkout, DB_USERNAME: checkout_service, DB_PASSWORD: checkout_service }
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health"], interval: 10s, timeout: 3s, retries: 12 }
    depends_on: { mysql: { condition: service_healthy } }
  inventory:
    build: ../inventory-service
    environment: { DB_URL: jdbc:mysql://mysql:3306/inventory, DB_USERNAME: inventory_service, DB_PASSWORD: inventory_service }
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health"], interval: 10s, timeout: 3s, retries: 12 }
    depends_on: { mysql: { condition: service_healthy } }
  analytics:
    build: ../analytics-service
    environment: { DB_URL: jdbc:mysql://mysql:3306/analytics, DB_USERNAME: analytics_service, DB_PASSWORD: analytics_service }
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health"], interval: 10s, timeout: 3s, retries: 12 }
    depends_on: { mysql: { condition: service_healthy } }
  gateway:
    build: ../api-gateway
    ports: ["8080:8080"]
    depends_on: [catalog, checkout, inventory, analytics]
    environment: { SERVICES_CATALOG_URL: http://catalog:8081, SERVICES_CHECKOUT_URL: http://checkout:8082, SERVICES_INVENTORY_URL: http://inventory:8083, SERVICES_ANALYTICS_URL: http://analytics:8084 }
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health"], interval: 10s, timeout: 3s, retries: 12 }
