server:
  port: "${SERVER_PORT:8084}"
  shutdown: graceful
spring:
  application: { name: analytics-service }
  datasource:
    # Credentials come only from deployment configuration (FR-028); nothing is defaulted here.
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    hikari: { maximum-pool-size: "${DB_POOL_SIZE:10}" }
  flyway: { enabled: true }
  lifecycle: { timeout-per-shutdown-phase: 20s }
  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP:localhost:9092}"
management:
  endpoint:
    health:
      probes: { enabled: true }
      show-details: always
      # Readiness covers this service's own database only; Flyway has finished before it can be UP.
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,metrics
catalog:
  url: "${CATALOG_URL:http://localhost:8081}"
  projection:
    poll-interval: 15s
    max-staleness: 60s
