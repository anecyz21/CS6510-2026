server:
  port: "${SERVER_PORT:8083}"
  shutdown: graceful
spring:
  application: { name: inventory-service }
  datasource:
    # Credentials come only from deployment configuration (FR-028); nothing is defaulted here.
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    hikari: { maximum-pool-size: "${DB_POOL_SIZE:10}" }
  flyway: { enabled: true }
  lifecycle: { timeout-per-shutdown-phase: 20s }
  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP:localhost:9092}"
  # The sale applier and the projection's catch-up check must not wait on each other.
  task:
    scheduling:
      pool:
        size: 2
management:
  endpoint:
    health:
      probes: { enabled: true }
      show-details: always
      # Readiness covers this service's own database and the broker (005 research R9); Flyway has
      # finished before it can be UP. Nothing routes on readiness while running.
      group:
        readiness:
          include: readinessState,db,kafka,catalogProjection
  endpoints:
    web:
      exposure:
        include: health,metrics
inventory:
  # Committed sales are applied to stock in batches this often (SaleApplier).
  sales:
    apply-interval: 100ms
  low-stock:
    # Default threshold for GET /inventory/low-stock when the request names none.
    threshold: "${LOW_STOCK_THRESHOLD:10}"
